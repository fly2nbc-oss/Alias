<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alias – hide names before you ask an AI</title>
    <!-- App icon (the masked smiley, src/assets/app-icon-224.png); vite.config.ts embeds it, so alias.html needs no extra files.
         Edge uses it for the window and the taskbar. -->
    <link rel="icon" type="image/png" sizes="224x224" href="data:," data-alias-icon />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>
      <div id="workspace">
        <div id="text-panel-container"></div>
        <div id="resize-handle" title="Drag to change the width"></div>
        <div id="mapping-panel-container"></div>
      </div>
      <div id="statusbar"></div>
    </div>
    <div id="modal-overlay" class="hidden"></div>
    <div id="toast-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
